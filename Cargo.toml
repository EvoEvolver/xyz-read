[package]
name = "xyz-read"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Agent-friendly XYZ trajectory inspector and molecular renderer"
license = "MIT"
repository = "https://github.com/EvoEvolver/xyz-read"
keywords = ["xyz", "chemistry", "molecule", "renderer", "cli"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true
